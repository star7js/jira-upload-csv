[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-csv-upload"
dynamic = ["version"]
description = "A Python tool for automating the creation of Jira issues and subtasks from CSV data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Josh Simnitt", email = "noreply@github.com"}
]
keywords = ["jira", "csv", "automation", "atlassian", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]
requires-python = ">=3.9"
dependencies = [
    "atlassian-python-api>=4.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
jira-csv-upload = "jira_csv_upload.cli:cli"

[project.urls]
Homepage = "https://github.com/star7js/jira-upload-csv"
Repository = "https://github.com/star7js/jira-upload-csv"
Issues = "https://github.com/star7js/jira-upload-csv/issues"

[tool.setuptools.dynamic]
version = {attr = "jira_csv_upload.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["jira_csv_upload*"]
namespaces = false

[tool.black]
line-length = 88
target-version = ['py39']

[tool.mypy]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["jira_csv_upload"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
